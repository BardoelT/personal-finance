[package]
name = "personal-finance"
version = "0.1.0"
edition = "2021"

[lib]
name = "personal_finance_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing", "local-offset"] }
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
float_arithmetic = "warn"
module_name_repetitions = "allow"
